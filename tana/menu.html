<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu — TANA</title>
  <meta name="description" content="Bold new flavors, paired with those you love. Food, drinks and dessert menus at TANA." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&family=Caveat:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/tana.css" />
</head>
<body>

  <div data-tana-header></div>

  <!-- HERO -->
  <section class="hero hero--page hero--media" style="--photo:url('img/menu-hero.jpg')">
    <h1 class="sr-only">Menu</h1>
  </section>

  <!-- TITULAR -->
  <section class="band band--olive">
    <div class="shell center stack reveal">
      <h2 class="title--display">Bold new flavors,</h2>
      <p class="script script--lg" style="margin:0;color:var(--light-soft)">paired with those you love.</p>
    </div>
  </section>

  <!-- CARTAS -->
  <section class="band band--olive band--tight">
    <div class="shell stack stack--lg reveal">
      <div class="sheet-grid">
        <figure class="sheet">
          <div class="photo" style="--photo:url('img/menu-food.jpg')" role="img" aria-label="Carta de comida, verano 2026"></div>
        </figure>
        <figure class="sheet">
          <div class="photo" style="--photo:url('img/menu-drinks.jpg')" role="img" aria-label="Carta de c&oacute;cteles, vinos y cervezas"></div>
        </figure>
      </div>

      <div class="split split--even" style="align-items:center">
        <figure class="sheet">
          <div class="photo" style="--photo:url('img/menu-desserts.jpg')" role="img" aria-label="Carta de postres, verano 2026"></div>
        </figure>

        <div class="stack">
          <a class="btn btn--quiet" href="contact.html" style="justify-self:center;letter-spacing:.18em;text-transform:uppercase">Get in touch</a>
          <div class="photo photo--wide" style="--photo:url('img/menu-dessert-dish.jpg')" role="img" aria-label="Postre emplatado"></div>
        </div>
      </div>
    </div>
  </section>

  <div data-tana-footer></div>

  <script src="js/tana.js"></script>
</body>
</html>
