<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gift Cards — TANA</title>
  <meta name="description" content="Give the table. TANA gift cards." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&family=Caveat:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/tana.css" />
</head>
<body>

  <div data-tana-header></div>

  <!-- HERO DE PÁGINA -->
  <section class="hero hero--page" style="--photo:url('img/gallery-room.jpg')">
    <div class="hero__inner">
      <h1 class="hero__name wordmark">Gift Cards</h1>
      <p class="eyebrow hero__kicker">Give the table</p>
    </div>
  </section>

  <!-- CONTENIDO — pendiente de la referencia -->
  <section class="band band--cream center">
    <div class="shell shell--narrow stack reveal">
      <h2 class="title">TANA gift cards</h2>
      <p class="lede">Disponibles en cualquier importe y canjeables en el restaurante.</p>
      <p class="eyebrow" style="color:var(--ink-soft)">Contenido pendiente de la referencia</p>
    </div>
  </section>

  <div data-tana-footer></div>

  <script src="js/tana.js"></script>

</html>
