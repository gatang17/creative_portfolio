<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Multi-Section Page</title>

</head>
<body>
    <main>
     
        <section id="home" class="fade-section">
          <div class="pixel-overlay"></div>
         <div>
            
            <p>jlpezc</p>

         </div> 
        </section>
      
        <section id="about" class="fade-section">
          <div class="pixel-overlay"></div>
          <h1>About</h1>
        </section>
      
        <section id="work" class="fade-section">
          <div class="pixel-overlay"></div>
          <h1>My Work</h1>
        </section>
      
        <section id="contact" class="fade-section">
          <div class="pixel-overlay"></div>
          <h1>Contact</h1>
        </section>
      </main>
      
      

  <style>
    body, html {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background-color: #1b1b1b;
  color: #f0f0f0;
}

section {
  position: sticky; /* se queda pegada mientras haces scroll */
  top: 0;
  width: 100%;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #604a4a;
  overflow: hidden;
}

/* Z-index creciente para que las secciones se apilen */
#home { z-index: 1; }
#about { z-index: 2; }
#work { z-index: 3; }
#contact { z-index: 4; }


h1 {
  font-size: 4rem;
  z-index: 1;
  position: relative;
}

/* Overlay de cuadritos */
.pixel-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(20, 1fr); /* 20 columnas de cuadritos */
  grid-template-rows: repeat(20, 1fr);   /* 20 filas */
  gap: 2px;
  z-index: 2;
}

.pixel-overlay div {
  background-color: #252525;
  opacity: 1;
  transition: opacity 0.3s ease;
}

</style>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const sections = document.querySelectorAll(".fade-section");

  // Crear cuadritos dentro del overlay
  sections.forEach(section => {
    const overlay = section.querySelector(".pixel-overlay");
    const total = 20 * 20;

    for(let i=0; i<total; i++){
      const block = document.createElement("div");
      overlay.appendChild(block);
    }
  });

  // Animación de cuadritos
  function animateSection(section){
    const blocks = section.querySelectorAll(".pixel-overlay div");
    blocks.forEach((block, index) => {
      setTimeout(() => {
        block.style.opacity = "0";
      }, Math.random() * 1000);
    });
  }

  // IntersectionObserver
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        animateSection(entry.target);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.3 });

  sections.forEach(section => observer.observe(section));
});


</script>
</body>
</html>
